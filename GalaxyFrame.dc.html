<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position: relative; width: 100%; aspect-ratio: 0.4615; border-radius: 9.5% / 4.4%; padding: 1.9%; background: linear-gradient(150deg, #33383d 0%, #101315 14%, #04060a 42%, #0a0d10 60%, #1e2226 82%, #3d434a 100%); box-shadow: 0 60px 110px -45px rgba(0,0,0,.9), 0 0 0 1px rgba(255,255,255,.1) inset;">
  <div style="position: relative; width: 100%; height: 100%; border-radius: 8% / 3.7%; overflow: hidden; background: #0a0b0c; box-shadow: 0 0 0 2px #0b0c0d inset;">
    <img src="{{ src }}" alt="{{ alt }}" style="display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 0;" />
    <div style="position: absolute; top: 1.1%; left: 50%; transform: translateX(-50%); width: 3.6%; aspect-ratio: 1; border-radius: 50%; background: #08090a;"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:700},&quot;src&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;assets/ga-home.jpeg&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;alt&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Mindflow Budget sur Galaxy S25&quot;,&quot;tsType&quot;:&quot;string&quot;}}"></script>
</body>
</html>
