<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position: relative; width: 100%; aspect-ratio: 0.4613; border-radius: 14% / 6.5%; padding: 2.5%; background: linear-gradient(150deg, #3a3f45 0%, #141719 16%, #05070a 44%, #0b0e11 60%, #23282d 82%, #454b52 100%); box-shadow: 0 60px 110px -45px rgba(0,0,0,.9), 0 0 0 1px rgba(255,255,255,.12) inset;">
  <div style="position: relative; width: 100%; height: 100%; border-radius: 12% / 5.6%; overflow: hidden; background: #0a0b0c; box-shadow: 0 0 0 3px #0b0c0d inset;">
    <img src="{{ src }}" alt="{{ alt }}" style="display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 0;" />
    <div style="position: absolute; top: 1.5%; left: 50%; transform: translateX(-50%); width: 26%; height: 3.4%; border-radius: 999px; background: #08090a;"></div>
    <div style="position: absolute; bottom: 1%; left: 50%; transform: translateX(-50%); width: 34%; height: 0.5%; border-radius: 999px; background: rgba(10,11,12,.5);"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:700},&quot;src&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;assets/ip-home.jpeg&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;alt&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Mindflow Budget sur iPhone&quot;,&quot;tsType&quot;:&quot;string&quot;}}"></script>
</body>
</html>
