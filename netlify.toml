[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/privacy"
  to = "/Confidentialite.dc.html"
  status = 301

[[redirects]]
  from = "/confidentialite"
  to = "/Confidentialite.dc.html"
  status = 301

[[redirects]]
  from = "/terms"
  to = "/Conditions.dc.html"
  status = 301

[[redirects]]
  from = "/conditions"
  to = "/Conditions.dc.html"
  status = 301

[[redirects]]
  from = "/support"
  to = "/Support.dc.html"
  status = 301
